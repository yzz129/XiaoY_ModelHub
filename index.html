    <script>
      (() => {
        const showLoadError = () => {
          const boot = document.getElementById('app-boot')
          if (!boot) return
          boot.classList.add('failed')
          const message = document.getElementById('app-boot-message')
          if (message) message.textContent = '页面加载遇到问题，请重新加载一次。'
        }
        window.setTimeout(showLoadError, 8000)
        window.addEventListener('error', (event) => {
          if (event.target instanceof HTMLScriptElement) showLoadError()
        }, true)
        window.addEventListener('unhandledrejection', showLoadError)
      })()
    </script>
